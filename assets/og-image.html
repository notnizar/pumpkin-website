<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pumpkin Group OG image source</title>
<!-- Source for assets/og-image.png (1200x630). Rendered with headless Chrome; see HANDOFF.md. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Figtree:wght@300..800&display=swap">
<style>
html,body{margin:0;padding:0}
body{position:relative;width:1200px;height:630px;overflow:hidden;background:#141210;color:#f4ede3;font-family:"Figtree","Helvetica Neue",Arial,sans-serif}
canvas{position:absolute;left:0;top:0}
.brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:12px;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:32px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px;display:block}
.pill{position:absolute;left:72px;top:150px;display:inline-flex;align-items:center;gap:10px;border:1px solid #352f27;border-radius:999px;padding:9px 16px;background:rgba(28,25,21,.85);font-size:18px;color:#b8ad9d;white-space:nowrap}
.pill .dot{width:9px;height:9px;border-radius:50%;background:#3f9a6e;box-shadow:0 0 0 4px rgba(63,154,110,.25)}
h1{position:absolute;left:72px;top:216px;margin:0;width:660px;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:86px;line-height:.96;letter-spacing:-.035em}
h1 em{color:#ff7a1a;font-style:italic;font-weight:600}
.sub{position:absolute;left:72px;bottom:60px;font-size:22px;color:#b8ad9d}
.sub span{color:#f4ede3;font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#ff7a1a}
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="brand">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 6c1.2-2.4 2.6-3.6 4.4-3.8.4 1.6-.2 3.2-1.6 4.6" fill="none" stroke="#3f9a6e" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="16" cy="18" rx="12.5" ry="10.5" fill="#ff7a1a"/>
    <path d="M16 7.5c-2.6 3-3.6 6.6-3.6 10.5s1 7.5 3.6 10.5M16 7.5c2.6 3 3.6 6.6 3.6 10.5s-1 7.5-3.6 10.5" fill="none" stroke="#1a0e04" stroke-opacity=".35" stroke-width="1.6"/>
  </svg>
  Pumpkin
</div>
<div class="pill"><span class="dot"></span>Branding · Marketing · Advertising · Digital</div>
<h1>We grow brands people <em>actually</em> remember.</h1>
<div class="sub"><span>Pumpkin Group</span> · Khilda, Amman, Jordan</div>
<div class="bar"></div>
<script>
(function () {
  // A still version of the hero's particle pumpkin: Fibonacci sphere, 10 cosine ribs,
  // flattened, dimpled poles, green stem cluster, thin orbit ring, dust. Deterministic (seeded).
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let seed = 42;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  // Dust across the whole image
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 1200, y = rnd() * 630, r = rnd() * 1.5 + 0.4, a = rnd() * 0.3 + 0.06;
    ctx.fillStyle = 'rgba(255,177,92,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const CX = 920, CY = 318, R = 236, N = 6000;
  const ay = 0.55, ax = 0.38; // yaw so the ribs read, pitch so the top dimple and stem show
  const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  const rot = (x, y, z) => {
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
    return [x1, y2, z2];
  };

  const golden = Math.PI * (3 - Math.sqrt(5));
  const items = [];
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N, y = 1 - 2 * t, r = Math.sqrt(1 - y * y), th = golden * i;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    const phi = Math.atan2(z, x);
    const rib = 1 + 0.055 * Math.cos(10 * phi) * r * r;
    const dimple = Math.pow(Math.abs(y), 8) * 0.18;
    items.push({ p: rot(x * rib, y * 0.8 * rib * (1 - dimple), z * rib), kind: 'o' });
  }
  for (let i = 0; i < 420; i++) {
    const h = rnd(), ang = rnd() * Math.PI * 2, rr = rnd() * 0.085;
    const x = Math.cos(ang) * rr + h * 0.2, y = 0.72 + h * 0.34 - h * h * 0.08, z = Math.sin(ang) * rr;
    items.push({ p: rot(x, y, z), kind: 'g' });
  }

  // Orbit ring behind the pumpkin
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(-0.32);
  ctx.strokeStyle = 'rgba(255,177,92,0.2)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 0, R * 1.36, R * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  items.sort((a, b) => a.p[2] - b.p[2]);
  for (const { p, kind } of items) {
    const d = (p[2] + 1) / 2; // 0 = back, 1 = front
    const px = CX + p[0] * R, py = CY - p[1] * R;
    const size = kind === 'g' ? 1.3 + d * 1.2 : 1.0 + d * 1.9;
    const a = 0.22 + d * 0.78;
    const col = kind === 'g'
      ? 'rgba(' + Math.round(63 + d * 60) + ',' + Math.round(154 + d * 50) + ',' + Math.round(110 + d * 40) + ',' + a.toFixed(3) + ')'
      : 'rgba(' + Math.round(150 + d * 105) + ',' + Math.round(63 + d * 114) + ',' + Math.round(12 + d * 80) + ',' + a.toFixed(3) + ')';
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
  }
})();
</script>
</body>
</html>
